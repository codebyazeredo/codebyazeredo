<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Matheus Azeredo — Full Stack Developer</title>
  <desc id="desc">Developer profile banner with a dark navy background, blue grid accents and terminal-inspired details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.58" stop-color="#102D50"/>
      <stop offset="1" stop-color="#075EAA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#38BDF8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#93C5FD" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="300" rx="22" fill="url(#glow)"/>
  <circle cx="1040" cy="35" r="170" fill="#38BDF8" opacity=".07"/>
  <circle cx="1080" cy="260" r="230" fill="#60A5FA" opacity=".06"/>
  <path d="M790 0 L650 300 M930 0 L790 300 M1070 0 L930 300" stroke="#7DD3FC" stroke-opacity=".12" stroke-width="1.5"/>
  <rect x="72" y="54" width="8" height="192" rx="4" fill="#38BDF8"/>
  <text x="108" y="91" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4">CODEBYAZEREDO / GITHUB PROFILE</text>
  <text x="104" y="163" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5">MATHEUS AZEREDO</text>
  <text x="108" y="207" fill="#BFDBFE" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="500">Full Stack Developer</text>
  <text x="108" y="244" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.4">BACKEND  /  APIs  /  ARCHITECTURE  /  APPLIED AI</text>
  <g transform="translate(1000 104)" opacity=".92">
    <rect x="0" y="0" width="132" height="92" rx="10" fill="#071426" fill-opacity=".72" stroke="#60A5FA" stroke-opacity=".55"/>
    <circle cx="17" cy="17" r="4" fill="#38BDF8"/>
    <circle cx="31" cy="17" r="4" fill="#60A5FA" opacity=".65"/>
    <circle cx="45" cy="17" r="4" fill="#93C5FD" opacity=".45"/>
    <path d="M24 43 L13 53 L24 63 M43 43 L54 53 L43 63 M68 66 L82 40" fill="none" stroke="#7DD3FC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
